name: Sola egress image

on:
  pull_request:
  push:
    branches: [master]
    tags: [egress-v*]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: egress/go.mod
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Static checks and unit tests
        working-directory: egress
        run: |
          git diff --exit-code
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          shellcheck integration.sh
          docker compose -f ../compose.egress.yml config --quiet
      - name: Build the image
        run: |
          docker buildx build --platform "linux/$ARCH" --load --provenance=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -f Dockerfile.egress -t "nordvpn-egress:test-$ARCH" .
      - name: Verify the official NordVPN client
        run: |
          expected=$(sed -n 's/^ARG NORDVPN_VERSION=//p' Dockerfile.egress)
          version=$(docker run --rm --network none --entrypoint nordvpn "nordvpn-egress:test-$ARCH" --version)
          printf '%s\n' "$version"
          [[ -n "$expected" && "$version" == "NordVPN Version $expected" ]]
      - name: Test WireGuard and Shadowsocks
        run: |
          if ! test -d /sys/module/wireguard; then
            sudo modprobe wireguard
          fi
          set -o pipefail
          if ! egress/integration.sh "nordvpn-egress:test-$ARCH" 2>&1 | tee "$RUNNER_TEMP/egress-test.log"; then
            error=$(grep -E 'Timed out waiting|"level":"ERROR"|RTNETLINK|Permission denied' "$RUNNER_TEMP/egress-test.log" | tail -n 1 || true)
            printf '::error::%s\n' "${error:-WireGuard integration test failed}"
            exit 1
          fi
      - name: Export the tested image
        run: |
          mkdir -p image
          docker save -o image/image.tar "nordvpn-egress:test-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nordvpn-egress-${{ matrix.arch }}
          path: image/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: nordvpn-egress-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Choose the image reference
        id: ref
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=${GITHUB_REF_NAME#egress-}
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          else
            tag="sha-$GITHUB_SHA"
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-egress" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nordvpn-egress-*
          path: images
      - name: Push the tested images and verify the manifest
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            archive="images/nordvpn-egress-$arch"
            local_ref="nordvpn-egress:test-$arch"
            staging="$IMAGE:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            tarball="$archive/image.tar"
            config=$(tar -xOf "$tarball" manifest.json | jq -er 'select(length == 1) | .[0].Config')
            checksum=$(tar -xOf "$tarball" "$config" | sha256sum)
            expected="sha256:${checksum%% *}"
            docker load -i "$tarball"
            [[ $(docker image inspect -f '{{.Os}}/{{.Architecture}}' "$local_ref") == "linux/$arch" ]]
            docker tag "$local_ref" "$staging"
            docker push "$staging"
            docker buildx imagetools inspect --raw "$staging" | jq -e --arg id "$expected" '.config.digest == $id' > /dev/null
            arch_digest=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
            [[ "$arch_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            refs+=("$IMAGE@$arch_digest")
          done

          target="$IMAGE:$TAG"
          docker buildx imagetools create -t "$target" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect --raw "$IMAGE@$digest" |
            jq -e --arg amd "${refs[0]##*@}" --arg arm "${refs[1]##*@}" "
              [.manifests[] | {os: .platform.os, arch: .platform.architecture, digest}] | sort_by(.arch) ==
              [{os:\"linux\",arch:\"amd64\",digest:\$amd},{os:\"linux\",arch:\"arm64\",digest:\$arm}]
            " >/dev/null
          # shellcheck disable=SC2016
          printf '### Sola egress image\n\n- Tag `%s`\n- Pinned image `%s@%s`\n- Platforms `linux/amd64`, `linux/arm64`\n' \
            "$target" "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
